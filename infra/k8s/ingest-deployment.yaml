apiVersion: apps/v1
kind: Deployment
metadata:
  name: fm-ingest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fm-ingest
  template:
    metadata:
      labels:
        app: fm-ingest
    spec:
      containers:
        - name: ingest
          image: your-registry/fm-ingest:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fm-secrets
                  key: database_url
