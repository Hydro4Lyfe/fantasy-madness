apiVersion: batch/v1
kind: Job
metadata:
  name: fm-migrate
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: your-registry/fm-web:latest
          command: ["npm","run","migrate:deploy","-w","@fantasy-madness/db"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fm-secrets
                  key: database_url
