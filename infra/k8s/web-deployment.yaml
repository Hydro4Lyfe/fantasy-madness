apiVersion: apps/v1
kind: Deployment
metadata:
  name: fm-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fm-web
  template:
    metadata:
      labels:
        app: fm-web
    spec:
      containers:
        - name: web
          image: your-registry/fm-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fm-secrets
                  key: database_url
