<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bracket Mockup v5</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #E6EDF3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    overflow-x: hidden;
  }
  .tab-bar {
    display: flex; justify-content: center; gap: 4px;
    padding: 16px 16px 0; border-bottom: 1px solid #30363D;
    background: #0d1117; position: sticky; top: 0; z-index: 100;
  }
  .tab {
    padding: 10px 16px; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em; color: #8B949E;
    cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s;
  }
  .tab:hover { color: #E6EDF3; }
  .tab.active { color: #E6EDF3; border-bottom-color: #3B82F6; }
  .view-label {
    text-align: center; padding: 20px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.15em; color: #3B82F6;
  }
  .matchup {
    border: 1px solid #30363D; border-radius: 4px;
    overflow: hidden; background: #161B22; flex-shrink: 0;
  }
  .team-row {
    display: flex; align-items: center; gap: 5px;
    cursor: pointer; transition: background 0.1s; font-size: 11px;
  }
  .team-row:first-child { border-bottom: 1px solid #30363D; }
  .team-row:hover { background: #1c2333; }
  .team-row.winner { background: #1c2333; }
  .team-row.loser { color: #6e7681; }
  .team-row.tbd { color: #484f58; cursor: default; }
  .team-logo {
    width: 16px; height: 16px; border-radius: 2px;
    background: rgba(255,255,255,0.08); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 7px; color: #8B949E;
  }
  .seed {
    font-size: 10px; font-weight: 700; color: #8B949E;
    width: 16px; text-align: right; flex-shrink: 0;
  }
  .team-row.winner .seed { color: #E6EDF3; }
  .team-row.loser .seed { color: #6e7681; }
  .team-name {
    flex: 1; font-weight: 500; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  /* Winner accent: left border highlight instead of radio */
  .team-row { border-left: 3px solid transparent; }
  .team-row.winner {
    border-left-color: #3B82F6;
  }
  .team-row.loser { opacity: 0.5; }
  .desktop-view { padding: 0 20px 40px; max-width: 1536px; margin: 0 auto; }
  .desktop-view .team-row { padding: 4px 6px; height: 26px; }
  .round-headers {
    display: flex; justify-content: center; gap: 0;
    padding: 0 0 12px; margin-bottom: 24px; border-bottom: 1px solid #21262D;
  }
  .rh { text-align: center; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #8B949E; flex-shrink: 0; }
  .rh-sub { font-size: 9px; color: #6e7681; font-weight: 400; margin-top: 1px; }
  .rh-conn { width: 32px; }
  .bracket-field { position: relative; margin: 0 auto; }
  .bracket-field .matchup { position: absolute; }
  .bracket-field .conn-line {
    position: absolute; border-color: #30363D; border-style: solid; border-width: 0;
  }
  .region-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.12em; color: #6e7681; padding: 0 4px 4px; position: absolute;
  }
  .ff-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.12em; color: #8B949E; text-align: center; position: absolute;
  }

  /* Championship card — larger, prominent, blue-accented */
  .champ-card {
    position: absolute;
    border: 1px solid #3B82F6;
    border-radius: 8px;
    overflow: hidden;
    background: #13171e;
    box-shadow:
      0 0 0 1px rgba(59,130,246,0.25),
      0 0 30px rgba(59,130,246,0.12),
      0 8px 32px rgba(0,0,0,0.5);
  }
  .champ-card .team-row {
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; transition: background 0.15s;
    font-size: 16px; height: 48px; padding: 8px 14px;
  }
  .champ-card .team-row:first-child { border-bottom: 1px solid rgba(59,130,246,0.15); }
  .champ-card .team-row:hover { background: rgba(59,130,246,0.06); }
  .champ-card .team-row.winner { background: rgba(59,130,246,0.08); }
  .champ-card .team-row.winner .seed { color: #E6EDF3; font-size: 15px; }
  .champ-card .team-row.winner .team-name { color: #E6EDF3; font-weight: 700; font-size: 16px; }
  .champ-card .team-row.loser { color: #6e7681; }
  .champ-card .team-row.tbd { color: #484f58; cursor: default; }
  .champ-card .team-logo { width: 28px; height: 28px; border-radius: 4px; font-size: 10px; }
  .champ-card .seed { font-size: 14px; width: 20px; font-weight: 800; }
  .champ-card .team-row { border-left-width: 4px; }
  .champ-card .team-row.winner { border-left-color: #3B82F6; }
  .champ-card .team-row.loser { opacity: 0.5; }

  .champ-label {
    position: absolute; text-align: center;
    font-size: 13px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.18em; color: #E6EDF3;
  }
  .champ-sublabel {
    position: absolute; text-align: center;
    font-size: 9px; color: #6e7681; letter-spacing: 0.08em;
  }

  /* ====== MOBILE ====== */
  .mobile-view { display: none; padding: 0 0 40px; overflow-x: hidden; }
  .m-round-bar {
    display: flex; align-items: stretch; justify-content: center;
    border-bottom: 1px solid #21262D; background: #0d1117;
    position: sticky; top: 45px; z-index: 90;
  }
  .m-round-col {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 10px 0; position: relative;
  }
  .m-round-col.current { flex: 2; }
  .m-round-col.next { flex: 1; opacity: 0.5; }
  .m-round-col .m-round-name { font-size: 13px; font-weight: 700; }
  .m-round-col .m-round-date { font-size: 10px; color: #8B949E; margin-top: 1px; }
  .m-round-col .m-round-pts { font-size: 10px; color: #6e7681; margin-top: 2px; }
  .m-round-col.current::after {
    content: ''; position: absolute; bottom: 0; left: 20%; right: 20%;
    height: 2px; background: #3B82F6;
  }
  .m-nav-arrow {
    width: 36px; display: flex; align-items: center; justify-content: center;
    color: #8B949E; cursor: pointer; font-size: 18px; flex-shrink: 0;
  }
  .round-progress { font-size: 11px; color: #6e7681; text-align: center; padding: 8px 0; }
  .mobile-region { padding: 0 0 0 12px; margin-bottom: 4px; }
  .mobile-region-header {
    font-size: 14px; font-weight: 700; font-style: italic;
    color: #8B949E; padding: 14px 4px 8px;
  }
  .m-pair {
    display: flex; align-items: stretch; margin-bottom: 10px; overflow: hidden;
  }
  .m-matchup-stack {
    display: flex; flex-direction: column; gap: 4px; width: 68%; flex-shrink: 0;
  }
  .m-matchup {
    border: 1px solid #30363D; border-radius: 4px;
    overflow: hidden; background: #161B22; width: 100%;
  }
  .m-matchup .team-row { height: 42px; padding: 6px 10px; gap: 7px; font-size: 13px; }
  .m-matchup .team-logo { width: 22px; height: 22px; border-radius: 3px; font-size: 9px; }
  .m-matchup .seed { font-size: 11px; width: 18px; }
  .m-matchup .team-row { border-left-width: 4px; }
  .m-conn {
    width: 28px; flex-shrink: 0; position: relative;
  }
  .m-conn::before {
    content: ''; position: absolute; left: 50%; top: 25%; bottom: 25%;
    width: 0; border-left: 1px solid #30363D;
  }
  .m-conn::after {
    content: ''; position: absolute; left: 0; top: 25%;
    width: 50%; border-top: 1px solid #30363D;
  }
  .m-conn-bot { position: absolute; left: 0; bottom: 25%; width: 50%; border-top: 1px solid #30363D; }
  .m-conn-out { position: absolute; right: 0; top: 50%; width: 50%; border-top: 1px solid #30363D; }
  .m-peek {
    flex-shrink: 0; display: flex; flex-direction: column; justify-content: center;
    width: 68%; /* same as parent stack — gets clipped by m-pair overflow:hidden */
  }
  .m-peek-card {
    background: #0f1318; border: 1px solid #252b33;
    border-radius: 4px; overflow: hidden; width: 100%;
  }
  .m-peek-card .team-row {
    height: 42px; padding: 6px 10px; gap: 7px; font-size: 13px; cursor: default;
    color: #8B949E;
  }
  .m-peek-card .team-row:first-child { border-bottom-color: #252b33; }
  .m-peek-card .team-row:hover { background: transparent; }
  .m-peek-card .team-logo { width: 22px; height: 22px; border-radius: 3px; font-size: 9px; opacity: 0.6; }
  .m-peek-card .seed { font-size: 11px; width: 18px; color: #6e7681; }
  .m-peek-label {
    font-size: 9px; color: #6e7681; text-transform: uppercase;
    letter-spacing: 0.06em; padding: 3px 0; margin-left: 2px;
  }
  body.show-mobile .desktop-view { display: none; }
  body.show-mobile .mobile-view { display: block; }
</style>
</head>
<body>
  <div class="tab-bar">
    <div class="tab active" onclick="showDesktop()">Desktop View</div>
    <div class="tab" onclick="showMobile()">Mobile View</div>
  </div>

  <div class="desktop-view">
    <div class="view-label">Desktop Bracket Layout</div>
    <div id="rh" class="round-headers"></div>
    <div id="bracket" class="bracket-field"></div>
  </div>

  <div class="mobile-view" style="max-width: 440px; margin: 0 auto;">
    <div class="view-label">Mobile Bracket Layout</div>
    <div class="m-round-bar">
      <div class="m-nav-arrow" style="opacity:0.3">&#8592;</div>
      <div class="m-round-col current">
        <div class="m-round-name">Round of 64</div>
        <div class="m-round-date">Mar 19 - 20</div>
        <div class="m-round-pts">10 pts</div>
      </div>
      <div class="m-round-col next">
        <div class="m-round-name">Round of 32</div>
        <div class="m-round-date">Mar 21 - 22</div>
        <div class="m-round-pts">20 pts</div>
      </div>
      <div class="m-nav-arrow">&#8594;</div>
    </div>
    <div class="round-progress">12 / 32 picks made</div>
    <div id="mobile-content"></div>
  </div>

  <script>
    // NOTE: This is a static mockup for design review only.
    // All data is hardcoded for demonstration purposes.
    // The production component will use React with proper DOM methods.

    var teams = {
      east: [
        [['1','D','Duke','w'],['16','S','Siena','l']],
        [['8','O','Ohio St','l'],['9','T','TCU','w']],
        [['5','S',"St. John's",'w'],['12','N','N. Iowa','l']],
        [['4','K','Kansas','l'],['13','C','CA Baptist','w']],
        [['6','L','Louisville','w'],['11','S','S. Florida','l']],
        [['3','M','Michigan St','w'],['14','N','N Dakota St','l']],
        [['7','U','UCLA',''],['10','-','Play-in','']],
        [['2','U','UConn',''],['15','F','Furman','']]
      ],
      south: [
        [['1','F','Florida','w'],['16','P','Prairie View','l']],
        [['8','W','Wisconsin',''],['9','C','Creighton','']],
        [['5','O','Oregon',''],['12','L','Liberty','']],
        [['4','A','Arizona St',''],['13','Y','Yale','']],
        [['6','I','Illinois',''],['11','T','Texas A&M','']],
        [['3','T','Texas Tech',''],['14','U','UNC Wilm.','']],
        [['7','C','Clemson',''],['10','N','New Mexico','']],
        [['2','A','Alabama',''],['15','R','R. Morris','']]
      ],
      west: [
        [['1','A','Arizona','w'],['16','L','Long Island','l']],
        [['8','V','Villanova',''],['9','U','Utah State','']],
        [['5','W','Wisconsin',''],['12','H','High Point','']],
        [['4','A','Arkansas',''],['13','H','Hawaii','']],
        [['6','B','BYU',''],['11','T','Texas','']],
        [['3','G','Gonzaga',''],['14','K','Kennesaw','']],
        [['7','M','Miami',''],['10','M','Missouri','']],
        [['2','P','Purdue',''],['15','Q','Quinnipiac','']]
      ],
      midwest: [
        [['1','H','Houston',''],['16','S','SIU-Ed.','']],
        [['8','N','Nebraska',''],['9','C','Colorado','']],
        [['5','M','Memphis',''],['12','C','Col. Chas.','']],
        [['4','M','Maryland',''],['13','G','Grand Canyon','']],
        [['6','M','Michigan',''],['11','S','Saint Louis','']],
        [['3','T','Tennessee',''],['14','W','Wofford','']],
        [['7','U','USC',''],['10','X','Xavier','']],
        [['2','M','Michigan',''],['15','D','Drake','']]
      ]
    };

    var r32 = {
      east: [[['1','D','Duke','w'],['9','T','TCU','l']],[['5','S',"St. John's",''],['13','C','CA Baptist','']],[['6','L','Louisville','w'],['3','M','Michigan St','l']],[['-','','---','t'],['-','','---','t']]],
      south: [[['1','F','Florida','w'],['-','','---','t']],[['-','','---','t'],['-','','---','t']],[['-','','---','t'],['-','','---','t']],[['-','','---','t'],['-','','---','t']]],
      west: [[['1','A','Arizona','w'],['-','','---','t']],[['-','','---','t'],['-','','---','t']],[['-','','---','t'],['-','','---','t']],[['-','','---','t'],['-','','---','t']]],
      midwest: [[['-','','---','t'],['-','','---','t']],[['-','','---','t'],['-','','---','t']],[['-','','---','t'],['-','','---','t']],[['-','','---','t'],['-','','---','t']]]
    };
    var s16 = {
      east: [[['1','D','Duke','w'],['-','','---','t']],[['6','L','Louisville','w'],['-','','---','t']]],
      south: [[['1','F','Florida','w'],['-','','---','t']],[['-','','---','t'],['-','','---','t']]],
      west: [[['1','A','Arizona','w'],['-','','---','t']],[['-','','---','t'],['-','','---','t']]],
      midwest: [[['-','','---','t'],['-','','---','t']],[['-','','---','t'],['-','','---','t']]]
    };
    var e8 = {
      east: [[['1','D','Duke','w'],['6','L','Louisville','l']]],
      south: [[['1','F','Florida','w'],['-','','---','t']]],
      west: [[['1','A','Arizona','w'],['-','','---','t']]],
      midwest: [[['-','','---','t'],['-','','---','t']]]
    };

    // ==================== DESKTOP ====================
    var MH = 53, GAP = 5, UNIT = MH + GAP, CW = 32, REGION_GAP = 100;
    var REGION_H = 8 * UNIT - GAP;
    var MW = 140; // will recalc
    var sB = REGION_H + REGION_GAP;

    function makeTeamRow(t, parent, hasRadio) {
      var row = document.createElement('div');
      var cls = 'team-row';
      if (t[3] === 'w') cls += ' winner';
      else if (t[3] === 'l') cls += ' loser';
      else if (t[3] === 't') cls += ' tbd';
      row.className = cls;
      var logo = document.createElement('div');
      logo.className = 'team-logo';
      logo.textContent = t[1];
      row.appendChild(logo);
      var seed = document.createElement('span');
      seed.className = 'seed';
      seed.textContent = t[0];
      row.appendChild(seed);
      var name = document.createElement('span');
      name.className = 'team-name';
      name.textContent = t[2];
      row.appendChild(name);
      parent.appendChild(row);
    }

    function buildDesktop() {
      var field = document.getElementById('bracket');
      var rh = document.getElementById('rh');
      field.textContent = '';
      rh.textContent = '';

      // Derive MW from available width — fill container, never overflow
      var containerW = document.querySelector('.desktop-view').clientWidth - 40; // minus padding
      var SIDE_GAP = 16;
      // totalWidth = 2*(4*MW + 3*CW) + SIDE_GAP = 8*MW + 6*CW + SIDE_GAP
      MW = Math.floor((containerW - 6 * CW - SIDE_GAP) / 8);
      MW = Math.max(MW, 80); // minimum usable width

      var sideWidth = 4 * MW + 3 * CW;
      var totalWidth = sideWidth + SIDE_GAP + sideWidth;

      field.style.width = totalWidth + 'px';

      var leftR64x = 0;
      var leftR32x = MW + CW;
      var leftS16x = (MW + CW) * 2;
      var leftE8x = (MW + CW) * 3;
      var rightE8x = sideWidth + SIDE_GAP;
      var rightS16x = rightE8x + MW + CW;
      var rightR32x = rightS16x + MW + CW;
      var rightR64x = rightR32x + MW + CW;

      // Center matchups float over the gap
      var bracketCenterX = totalWidth / 2;
      var centerMW = MW;
      var CENTER_GAP = Math.max(16, MW * 0.3); // scale gap with matchup width
      var ffLeftX = bracketCenterX - centerMW * 1.5 - CENTER_GAP;
      var ffRightX = bracketCenterX + centerMW * 0.5 + CENTER_GAP;

      // Build headers
      var leftRounds = [['R64','Mar 19-20'],['R32','Mar 21-22'],['Sweet 16','Mar 26-27']];
      var rightRounds = [['Sweet 16','Mar 26-27'],['R32','Mar 21-22'],['R64','Mar 19-20']];

      leftRounds.forEach(function(r, i) {
        if (i > 0) { var c = document.createElement('div'); c.className = 'rh rh-conn'; rh.appendChild(c); }
        var d = document.createElement('div'); d.className = 'rh'; d.style.width = MW + 'px';
        d.textContent = r[0]; var sub = document.createElement('div'); sub.className = 'rh-sub'; sub.textContent = r[1]; d.appendChild(sub);
        rh.appendChild(d);
      });

      var finalRoundsW = MW + CW + SIDE_GAP + CW + MW;
      var connBefore = document.createElement('div'); connBefore.className = 'rh rh-conn'; rh.appendChild(connBefore);
      var centerH = document.createElement('div');
      centerH.className = 'rh';
      centerH.style.width = finalRoundsW + 'px';
      centerH.textContent = 'Final Rounds';
      var centerSub = document.createElement('div');
      centerSub.className = 'rh-sub';
      centerSub.textContent = 'Mar 28 - Apr 7';
      centerH.appendChild(centerSub);
      rh.appendChild(centerH);

      rightRounds.forEach(function(r, i) {
        var c = document.createElement('div'); c.className = 'rh rh-conn'; rh.appendChild(c);
        var d = document.createElement('div'); d.className = 'rh'; d.style.width = MW + 'px';
        d.textContent = r[0]; var sub = document.createElement('div'); sub.className = 'rh-sub'; sub.textContent = r[1]; d.appendChild(sub);
        rh.appendChild(d);
      });

    function makeMatchup(t, x, y) {
      var m = document.createElement('div');
      m.className = 'matchup';
      m.style.left = x + 'px';
      m.style.top = y + 'px';
      m.style.width = MW + 'px';
      makeTeamRow(t[0], m, true);
      makeTeamRow(t[1], m, true);
      field.appendChild(m);
    }

    function makeMatchupW(t, x, y, w) {
      var m = document.createElement('div');
      m.className = 'matchup';
      m.style.left = x + 'px';
      m.style.top = y + 'px';
      m.style.width = w + 'px';
      makeTeamRow(t[0], m, true);
      makeTeamRow(t[1], m, true);
      field.appendChild(m);
    }

    function addLine(x1, y1, x2, y2) {
      var l = document.createElement('div');
      l.className = 'conn-line';
      if (y1 === y2) {
        l.style.left = Math.min(x1, x2) + 'px';
        l.style.top = y1 + 'px';
        l.style.width = Math.abs(x2 - x1) + 'px';
        l.style.borderTopWidth = '1px';
      } else {
        l.style.left = x1 + 'px';
        l.style.top = Math.min(y1, y2) + 'px';
        l.style.height = Math.abs(y2 - y1) + 'px';
        l.style.borderLeftWidth = '1px';
      }
      field.appendChild(l);
    }

    function drawConn(x1, y1top, y1bot, x2, y2, side) {
      var midY1 = y1top + MH / 2, midY2 = y1bot + MH / 2, outY = y2 + MH / 2;
      if (side === 'left') {
        addLine(x1 + MW, midY1, x1 + MW + CW / 2, midY1);
        addLine(x1 + MW, midY2, x1 + MW + CW / 2, midY2);
        addLine(x1 + MW + CW / 2, midY1, x1 + MW + CW / 2, midY2);
        addLine(x1 + MW + CW / 2, outY, x2, outY);
      } else {
        addLine(x1, midY1, x1 - CW / 2, midY1);
        addLine(x1, midY2, x1 - CW / 2, midY2);
        addLine(x1 - CW / 2, midY1, x1 - CW / 2, midY2);
        addLine(x1 - CW / 2, outY, x2 + MW, outY);
      }
    }

    function addLabel(text, x, y, align) {
      var d = document.createElement('div');
      d.className = 'region-label';
      d.textContent = text;
      d.style.left = x + 'px';
      d.style.top = y + 'px';
      if (align === 'right') { d.style.textAlign = 'right'; d.style.width = MW + 'px'; }
      field.appendChild(d);
    }

    function getR32y(b, i) { return (b + i * 2 * UNIT + b + (i * 2 + 1) * UNIT + MH) / 2 - MH / 2; }
    function getS16y(b, i) { return (getR32y(b, i * 2) + getR32y(b, i * 2 + 1) + MH) / 2 - MH / 2; }
    function getE8y(b) { return (getS16y(b, 0) + getS16y(b, 1) + MH) / 2 - MH / 2; }

    function drawRegion(data, r32d, s16d, e8d, rx, base, side, label, labelAlign) {
      addLabel(label, rx, base - 18, labelAlign);
      var r32x = side === 'left' ? leftR32x : rightR32x;
      var s16x = side === 'left' ? leftS16x : rightS16x;
      var e8x = side === 'left' ? leftE8x : rightE8x;
      data.forEach(function(t, i) { makeMatchup(t, rx, base + i * UNIT); });
      r32d.forEach(function(t, i) {
        var y = getR32y(base, i);
        makeMatchup(t, r32x, y);
        drawConn(rx, base + i * 2 * UNIT, base + (i * 2 + 1) * UNIT, r32x, y, side);
      });
      s16d.forEach(function(t, i) {
        var y = getS16y(base, i);
        makeMatchup(t, s16x, y);
        drawConn(r32x, getR32y(base, i * 2), getR32y(base, i * 2 + 1), s16x, y, side);
      });
      var ey = getE8y(base);
      makeMatchup(e8d[0], e8x, ey);
      drawConn(s16x, getS16y(base, 0), getS16y(base, 1), e8x, ey, side);
    }

    drawRegion(teams.east, r32.east, s16.east, e8.east, leftR64x, 0, 'left', 'East');
    drawRegion(teams.south, r32.south, s16.south, e8.south, leftR64x, sB, 'left', 'South');
    drawRegion(teams.west, r32.west, s16.west, e8.west, rightR64x, 0, 'right', 'West', 'right');
    drawRegion(teams.midwest, r32.midwest, s16.midwest, e8.midwest, rightR64x, sB, 'right', 'Midwest', 'right');

    // Center: [FF Left] [Championship] [FF Right] — all on same Y, champ centered
    var gapCenter = (REGION_H + sB) / 2;
    var centerY = gapCenter - MH / 2;

    // FF Left (East champ vs South champ)
    makeMatchupW([['1','D','Duke','w'],['1','F','Florida','l']], ffLeftX, centerY, centerMW);

    // FF Left label
    var fflL = document.createElement('div');
    fflL.className = 'ff-label';
    fflL.textContent = 'FINAL FOUR';
    fflL.style.left = ffLeftX + 'px';
    fflL.style.top = (centerY - 16) + 'px';
    fflL.style.width = centerMW + 'px';
    field.appendChild(fflL);

    // Championship — wider, taller, centered, the focal point
    var champCardW = centerMW + 40;
    var champCardH = 97; // 48px * 2 + 1px border
    var champY = gapCenter - champCardH / 2;
    var champX = bracketCenterX - champCardW / 2;

    // Championship label
    var champL = document.createElement('div');
    champL.className = 'champ-label';
    champL.textContent = 'CHAMPIONSHIP';
    champL.style.left = champX + 'px';
    champL.style.top = (champY - 32) + 'px';
    champL.style.width = champCardW + 'px';
    field.appendChild(champL);

    // Sublabel
    var champSub = document.createElement('div');
    champSub.className = 'champ-sublabel';
    champSub.textContent = 'Indianapolis, IN \u2022 Apr 7';
    champSub.style.left = champX + 'px';
    champSub.style.top = (champY - 18) + 'px';
    champSub.style.width = champCardW + 'px';
    field.appendChild(champSub);

    var champCard = document.createElement('div');
    champCard.className = 'champ-card';
    champCard.style.left = champX + 'px';
    champCard.style.top = champY + 'px';
    champCard.style.width = champCardW + 'px';
    makeTeamRow(['1','D','Duke','w'], champCard, true);
    makeTeamRow(['-','','---','t'], champCard, true);
    field.appendChild(champCard);

    // FF Right (West champ vs Midwest champ)
    makeMatchupW([['-','','---','t'],['-','','---','t']], ffRightX, centerY, centerMW);

    // FF Right label
    var fflR = document.createElement('div');
    fflR.className = 'ff-label';
    fflR.textContent = 'FINAL FOUR';
    fflR.style.left = ffRightX + 'px';
    fflR.style.top = (centerY - 16) + 'px';
    fflR.style.width = centerMW + 'px';
    field.appendChild(fflR);

    // Connector lines: FF Left -> Championship, FF Right -> Championship
    var ffMidY = centerY + MH / 2;

    // FF Left: horizontal line from right edge to championship left edge
    addLine(ffLeftX + centerMW, ffMidY, champX, ffMidY);

    // FF Right: horizontal line from left edge to championship right edge
    addLine(champX + champCardW, ffMidY, ffRightX, ffMidY);

    field.style.height = totalH + 'px';
    } // end buildDesktop

    var resizeTimer;

    // ==================== MOBILE ====================
    var mc = document.getElementById('mobile-content');

    function buildMobilePair(parent1, parent2, peek1, peek2) {
      var pair = document.createElement('div');
      pair.className = 'm-pair';

      // Parent stack
      var stack = document.createElement('div');
      stack.className = 'm-matchup-stack';

      [parent1, parent2].forEach(function(matchup) {
        var card = document.createElement('div');
        card.className = 'm-matchup';
        makeTeamRow(matchup[0], card, true);
        makeTeamRow(matchup[1], card, true);
        stack.appendChild(card);
      });
      pair.appendChild(stack);

      // Connector
      var conn = document.createElement('div');
      conn.className = 'm-conn';
      var bot = document.createElement('div');
      bot.className = 'm-conn-bot';
      conn.appendChild(bot);
      var out = document.createElement('div');
      out.className = 'm-conn-out';
      conn.appendChild(out);
      pair.appendChild(conn);

      // Peek card (full size, clipped)
      var peek = document.createElement('div');
      peek.className = 'm-peek';
      var peekCard = document.createElement('div');
      peekCard.className = 'm-peek-card';
      makeTeamRow(peek1, peekCard, false);
      makeTeamRow(peek2, peekCard, false);
      peek.appendChild(peekCard);

      pair.appendChild(peek);

      return pair;
    }

    function buildMobileRegion(name, matchups, r32data) {
      var region = document.createElement('div');
      region.className = 'mobile-region';
      var header = document.createElement('div');
      header.className = 'mobile-region-header';
      header.textContent = name;
      region.appendChild(header);

      for (var i = 0; i < 4; i++) {
        region.appendChild(buildMobilePair(
          matchups[i * 2], matchups[i * 2 + 1],
          r32data[i][0], r32data[i][1]
        ));
      }
      return region;
    }

    mc.appendChild(buildMobileRegion('EAST', teams.east, r32.east));
    mc.appendChild(buildMobileRegion('WEST', teams.west, r32.west));
    mc.appendChild(buildMobileRegion('SOUTH', teams.south, r32.south));
    mc.appendChild(buildMobileRegion('MIDWEST', teams.midwest, r32.midwest));

    // ==================== VIEW SWITCHING ====================
    var MOBILE_BP = 768;
    var manualOverride = false;

    function showDesktop() {
      manualOverride = true;
      document.body.classList.remove('show-mobile');
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.tab')[0].classList.add('active');
      buildDesktop();
    }
    function showMobile() {
      manualOverride = true;
      document.body.classList.add('show-mobile');
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.tab')[1].classList.add('active');
    }

    // Auto-switch based on viewport width
    function checkViewport() {
      if (manualOverride) return;
      if (window.innerWidth < MOBILE_BP) {
        document.body.classList.add('show-mobile');
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.tab')[1].classList.add('active');
      } else {
        document.body.classList.remove('show-mobile');
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.tab')[0].classList.add('active');
        buildDesktop();
      }
    }

    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        if (!manualOverride) {
          checkViewport();
        } else if (!document.body.classList.contains('show-mobile')) {
          buildDesktop();
        }
      }, 150);
    });

    // Initial check
    checkViewport();
  </script>
</body>
</html>
